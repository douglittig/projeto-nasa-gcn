# ==============================================================================
# DATABRICKS JOB: NASA GCN Pipeline Orchestration
# ==============================================================================
#
# Este job orquestra a execução dos 3 pipelines em ordem:
#   1. Bronze Pipeline → Ingere dados brutos do Kafka
#   2. Silver Pipeline → Limpa e tipifica os dados
#   3. Gold Pipeline   → Agrega e enriquece para consumo
#
# Arquitetura Medallion:
#   nasa_gcn.bronze.raw → nasa_gcn.silver.* → nasa_gcn.gold.*
#
# Schedule: Todos os dias às 8:00 AM (horário de Brasília)
# ==============================================================================

resources:
  jobs:
    nasa_gcn_job:
      name: "[${bundle.target}] NASA GCN Daily Ingestion"

      # ------------------------------------------------------------------------
      # SCHEDULE: Agendamento do job
      # ------------------------------------------------------------------------
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"  # 8:00 AM diariamente
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED

      # Email notifications (uncomment to enable)
      # email_notifications:
      #   on_failure:
      #     - seu_email@exemplo.com

      # ------------------------------------------------------------------------
      # TASKS: Pipeline orchestration (Bronze → Silver → Gold)
      # ------------------------------------------------------------------------
      tasks:
        # ======================================================================
        # TASK 1: Validação de Pré-requisitos
        # ======================================================================
        - task_key: validate
          notebook_task:
            notebook_path: ../src/notebook.ipynb

        # ======================================================================
        # TASK 2: Bronze Pipeline - Raw Data Ingestion
        # ======================================================================
        - task_key: bronze
          depends_on:
            - task_key: validate
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_pipeline.id}

        # ======================================================================
        # TASK 3: Silver Pipeline - Data Cleaning & Typing
        # ======================================================================
        - task_key: silver
          depends_on:
            - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_pipeline.id}

        # ======================================================================
        # TASK 4: Gold Pipeline - Aggregation & Enrichment
        # ======================================================================
        - task_key: gold
          depends_on:
            - task_key: silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}

        # ======================================================================
        # TASK 5: Status Report
        # ======================================================================
        - task_key: report
          depends_on:
            - task_key: gold
          environment_key: default
          python_wheel_task:
            package_name: nasa_gcn
            entry_point: main
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema-bronze"
              - "${var.schema_bronze}"
              - "--schema-silver"
              - "${var.schema_silver}"
              - "--schema-gold"
              - "${var.schema_gold}"

      # ------------------------------------------------------------------------
      # ENVIRONMENTS
      # ------------------------------------------------------------------------
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
