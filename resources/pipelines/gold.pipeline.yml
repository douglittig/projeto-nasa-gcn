# ==============================================================================
# GOLD PIPELINE: Enriched & Aggregated Data
# ==============================================================================
# Creates business-ready tables with aggregations and enrichments
# from Silver layer tables.
#
# Source: nasa_gcn.silver.*
# Target: nasa_gcn.gold.*
# ==============================================================================

resources:
  pipelines:
    gold_pipeline:
      name: "[${bundle.target}] NASA GCN Gold"

      # Unity Catalog destination
      catalog: ${var.catalog}
      schema: ${var.schema_gold}

      # Serverless execution
      serverless: true

      # Pipeline code (SQL for CLUSTER BY AUTO support)
      libraries:
        - file:
            path: ../../src/nasa_gcn/pipelines/gold_pipeline.sql

      # Configuration passed to pipeline
      configuration:
        # Source catalog/schema for reading Silver data
        silver_catalog: ${var.catalog}
        silver_schema: ${var.schema_silver}

      # Failure notifications (disabled in dev via target override)
      notifications:
        - email_recipients:
            - ${var.notification_email}
          alerts:
            - on-update-failure
            - on-update-fatal-failure
            - on-flow-failure

      # Resource tags for cost tracking and organization
      tags:
        project: nasa-gcn
        layer: gold
